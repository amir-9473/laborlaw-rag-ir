[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laborlaw-rag-ir"
version = "1.0.0"
description = "Grounded Persian RAG assistant for the Iranian Labor Law"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.115,<1",
    "gradio>=6.26,<7",
    "numpy>=1.26,<3",
    "python-dotenv>=1.0,<2",
    "rank-bm25>=0.2,<1",
    "requests>=2.31,<3",
    "streamlit>=1.40,<2",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "nbformat>=5.10,<6",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]
notebooks = ["ipykernel>=6.29,<8"]
pdf = ["pypdf>=5,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = ["live: opt-in tests that call external APIs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
