name: laborlaw-rag-ir

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laborlaw-rag-ir-streamlit:latest
    container_name: laborlaw-rag-streamlit
    env_file:
      - .env
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: "none"
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    container_name: laborlaw-rag-caddy
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-http://:80}"
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://app:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
