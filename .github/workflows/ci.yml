name: CI

on:
  push:
    branches: [develop, main, "refactor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src tests notebooks streamlit_app.py app.py
      - run: python -m ruff format --check src tests notebooks streamlit_app.py app.py
      - run: python -m pytest -m "not live"
